name: Feature request
description: Propose an AX contract update or policy rule.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: input
    id: evidence
    attributes:
      label: Upstream AX evidence
      description: Link the exact AX source, documentation, issue, or commit supporting the behavior.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
