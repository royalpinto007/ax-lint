name: Bug report
description: Report incorrect parsing, diagnostics, or CLI behavior.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: manifest
    attributes:
      label: Minimal manifest
      description: Remove secrets before pasting YAML.
      render: yaml
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: npx ax-lint ax.yaml
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ax-lint and Node versions
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Actual and expected result
    validations:
      required: true
